<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DogeFood – Connect Wallet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --gold:#f5c542; --sky:#5ec8ff; --dark:#0f1221; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #0b0e19; color: #fff; display:flex; align-items:center; justify-content:center; height:100vh; }
    .card { background: linear-gradient(145deg, #0f1221, #0b0e19); padding: 24px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.35); width: 360px; text-align:center; border:1px solid rgba(255,255,255,.08);}
    h1 { font-size: 20px; margin: 0 0 12px; }
    .btn { cursor: pointer; border: none; padding: 12px 16px; border-radius: 12px; font-weight: 700; letter-spacing:.2px; }
    .btn-primary { background: linear-gradient(90deg, var(--gold), var(--sky)); color:#0b0e19; }
    .btn-secondary { background: rgba(255,255,255,.08); color:#fff; }
    .row { display:flex; gap:10px; justify-content:center; margin-top:12px; }
    .status { margin-top: 10px; font-size: 13px; opacity:.85; }
    .addr { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Connect to DogeOS (Devnet)</h1>
    <button id="connectButton" class="btn btn-primary">Connect Wallet</button>
    <div class="status" id="status">Not connected</div>
    <div class="row">
      <button id="mintButton" class="btn btn-secondary" disabled>Mint (Coming Soon)</button>
    </div>
  </div>

  <script type="module">
    const CHAIN_ID_HEX = "0x0D2E0F74"; // 221122420
    const DOGEOS_PARAMS = {
      chainId: CHAIN_ID_HEX,
      chainName: "DogeOS Devnet",
      nativeCurrency: { name: "DOGE", symbol: "DOGE", decimals: 18 },
      rpcUrls: ["https://rpc.devnet.doge.xyz"],
      blockExplorerUrls: ["https://blockscout.devnet.doge.xyz"]
    };

    const $ = (id) => document.getElementById(id);
    const connectBtn = $("connectButton");
    const statusEl = $("status");
    const mintBtn = $("mintButton");

    const shorten = (addr) => addr ? addr.slice(0,6) + "…" + addr.slice(-4) : "";

    async function ensureDogeOS() {
      const provider = window.ethereum;
      if (!provider) throw new Error("No Ethereum provider found. Install MetaMask.");
      const current = await provider.request({ method: "eth_chainId" });
      if (current?.toLowerCase() === CHAIN_ID_HEX.toLowerCase()) return true;
      try {
        await provider.request({ method: "wallet_switchEthereumChain", params: [{ chainId: CHAIN_ID_HEX }] });
      } catch (err) {
        // If chain not added, add it
        if (err.code === 4902) {
          await provider.request({ method: "wallet_addEthereumChain", params: [DOGEOS_PARAMS] });
        } else {
          throw err;
        }
      }
      return true;
    }

    async function connect() {
      const provider = window.ethereum;
      if (!provider) {
        statusEl.textContent = "Please install MetaMask to connect.";
        return;
      }
      try {
        await ensureDogeOS();
        const accounts = await provider.request({ method: "eth_requestAccounts" });
        const addr = accounts[0];
        statusEl.innerHTML = `Connected: <span class="addr">${shorten(addr)}</span> on DogeOS Devnet`;
        connectBtn.textContent = "Connected";
        connectBtn.disabled = true;
        mintBtn.disabled = false; // enable when you wire mint; keep label as Coming Soon if needed
      } catch (e) {
        statusEl.textContent = "Connection failed: " + (e?.message || e);
      }
    }

    connectBtn.addEventListener("click", connect);

    // OPTIONAL: wire mint later — placeholder only
    mintBtn.addEventListener("click", async () => {
      alert("Mint coming soon. This button will call your DogeFood contract on DogeOS when ready.");
      // Example wiring (uncomment after you provide address + ABI and add a signer library):
      // const CONTRACT_ADDRESS = "YOUR_CONTRACT_ADDRESS";
      // const CONTRACT_ABI = YOUR_CONTRACT_ABI;
      // const provider = new ethers.providers.Web3Provider(window.ethereum);
      // const signer = provider.getSigner();
      // const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
      // await contract.mint(); // or your specific mint function
    });

    // React to account / network changes
    if (window.ethereum) {
      window.ethereum.on?.("accountsChanged", (accs) => {
        if (!accs.length) {
          statusEl.textContent = "Disconnected";
          connectBtn.textContent = "Connect Wallet";
          connectBtn.disabled = false;
          mintBtn.disabled = true;
        } else {
          statusEl.innerHTML = `Connected: <span class="addr">${shorten(accs[0])}</span>`;
        }
      });
      window.ethereum.on?.("chainChanged", () => window.location.reload());
    }
  </script>
</body>
</html>
